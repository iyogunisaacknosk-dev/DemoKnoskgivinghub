<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KNOSK Giving Hub — ₦100-a-Day Charity Secondary School</title>
<meta name="description" content="See what it takes to keep KNOSK children learning in ${esc(SETTINGS.sessionLabel)}, what has already been funded, and where your giving can make a difference.">
<meta name="theme-color" content="#08182F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   KNOSK GIVING HUB — design tokens

   BRAND COLOURS
   Sampled directly from the official KNOSK logo artwork supplied
   for this build. KNOSK Blue #003072, KNOSK Gold #E8A300.
   Change them here only — everything else inherits.
   ============================================================ */
:root{
  --knosk-blue:#003072;        /* sampled from logo */
  --knosk-blue-700:#00214F;
  --knosk-blue-100:#E3EAF4;
  --knosk-gold:#E8A300;        /* sampled from logo */
  --knosk-gold-600:#C48A00;   /* hover / fills */
  --knosk-gold-ink:#8C6200;   /* small gold text on light */
  --knosk-gold-100:#FAEECF;
  --navy:#08182F;
  --navy-800:#0F2647;
  --navy-600:#1A3A63;
  --paper:#FCFAF6;
  --paper-2:#F5F1E9;
  --ink:#12233D;
  --muted:#5C6E88;
  --line:#DFE5EE;
  --green:#17734E;
  --green-100:#E3F3EC;
  --amber:#B4740A;
  --red:#B03A2E;
  --white:#fff;

  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

  --r-sm:8px; --r:14px; --r-lg:20px; --r-xl:28px;
  --shadow:0 1px 2px rgba(11,31,58,.06),0 8px 24px -12px rgba(11,31,58,.18);
  --shadow-lg:0 2px 4px rgba(11,31,58,.06),0 24px 48px -20px rgba(11,31,58,.28);
  --wrap:1120px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--knosk-blue);text-underline-offset:3px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.12;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(2rem,6.2vw,3.5rem)}
h2{font-size:clamp(1.5rem,4.2vw,2.25rem)}
h3{font-size:clamp(1.15rem,3vw,1.4rem)}
p{margin:0 0 1em}
:focus-visible{outline:3px solid var(--knosk-gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:20px}
.wrap-narrow{max-width:760px}
.stack>*+*{margin-top:var(--gap,16px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.center{text-align:center}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- micro label: the recurring structural device ---------- */
.eyebrow{
  font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 .5rem;display:block
}
.eyebrow-gold{color:var(--knosk-gold-ink)}
.eyebrow-light{color:rgba(255,255,255,.62)}

/* ---------- skip link ---------- */
.skip{position:absolute;left:-9999px;top:8px;z-index:200;background:var(--navy);color:#fff;padding:10px 16px;border-radius:var(--r-sm)}
.skip:focus{left:12px}

/* ============ LOGO SLOT ============ */
.logo-slot{display:inline-flex;align-items:center;justify-content:center;flex:none;
  height:44px;box-sizing:border-box}
/* the mark is deep blue on black outlines, so it needs a light plate on dark ground */
.ftr .logo-slot,.rc-hd .logo-slot,.pres .logo-slot,.hero .logo-slot{
  background:#fff;border-radius:10px;padding:5px 8px}
.logo-slot img{height:100%;width:auto;object-fit:contain;display:block}
.logo-ph{
  height:100%;display:flex;align-items:center;justify-content:center;
  border:1.5px dashed var(--knosk-blue);border-radius:6px;background:#fff;
  padding:0 10px;text-align:center;
}
.logo-ph span{
  font-size:8px;line-height:1.15;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--knosk-blue);max-width:11ch
}

/* ============ HEADER ============ */
.hdr{position:sticky;top:0;z-index:60;background:rgba(252,250,246,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:11px;min-height:72px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;min-width:0}
.brand .logo-slot{height:52px}
.brand-txt{min-width:0}
.brand-name{font-family:var(--display);font-weight:700;font-size:1.02rem;line-height:1.1;color:var(--navy);white-space:nowrap}
.brand-sub{display:none;font-size:.66rem;color:var(--muted);line-height:1.2;letter-spacing:.01em}
@media(min-width:560px){.brand-sub{display:block}}
.hdr-nav{margin-left:auto;display:none;gap:4px;align-items:center}
@media(min-width:900px){.hdr-nav{display:flex}}
.hdr-nav a{
  text-decoration:none;color:var(--ink);font-size:.875rem;font-weight:500;
  padding:8px 12px;border-radius:999px
}
.hdr-nav a:hover{background:var(--knosk-blue-100);color:var(--knosk-blue-700)}
.hdr-nav a.on{background:var(--knosk-blue-100);color:var(--knosk-blue-700);font-weight:600}
.hdr-cta{display:none}
@media(min-width:900px){.hdr-cta{display:inline-flex;margin-left:8px}}
.burger{margin-left:auto;display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
@media(min-width:900px){.burger{display:none}}
.burger svg{width:20px;height:20px}
.mobnav{display:none;border-top:1px solid var(--line);background:#fff;padding:8px 0 14px}
.mobnav.open{display:block}
.mobnav a{display:block;padding:12px 20px;text-decoration:none;color:var(--ink);font-weight:500;border-radius:10px}
.mobnav a.on{color:var(--knosk-blue-700);background:var(--knosk-blue-100)}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;border-radius:999px;border:1.5px solid transparent;
  font-weight:600;font-size:.94rem;cursor:pointer;text-decoration:none;
  transition:transform .12s ease,box-shadow .18s ease,background .18s ease;
  min-height:46px;
}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--knosk-gold);color:#3A2A00;box-shadow:0 6px 18px -8px rgba(242,177,10,.9)}
.btn-gold:hover{background:var(--knosk-gold-600)}
.btn-blue{background:var(--knosk-blue);color:#fff}
.btn-blue:hover{background:var(--knosk-blue-700)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--knosk-blue);color:var(--knosk-blue-700)}
.btn-onnavy{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.32);color:#fff}
.btn-onnavy:hover{background:rgba(255,255,255,.18)}
.btn-sm{padding:8px 15px;min-height:36px;font-size:.82rem}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ============ HERO ============ */
.hero{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.hero-photo{position:absolute;inset:0;background-size:cover;background-position:50% 42%}
/* scrim: dark enough that white type always clears contrast, light enough that
   the community behind it is still legible. No text is baked into the image. */
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(7,23,48,.88) 0%,rgba(7,23,48,.70) 45%,rgba(7,23,48,.90) 100%),
    radial-gradient(90% 70% at 88% 0%,rgba(232,163,0,.16),transparent 62%);
}
@media(min-width:960px){.hero::after{background:
  linear-gradient(95deg,rgba(7,23,48,.95) 0%,rgba(7,23,48,.82) 40%,rgba(7,23,48,.44) 76%,rgba(7,23,48,.58) 100%),
  radial-gradient(80% 90% at 92% 8%,rgba(232,163,0,.18),transparent 60%)}}
.hero-in{position:relative;z-index:2;padding:44px 0 52px;display:grid;gap:34px}
@media(min-width:960px){.hero-in{padding:86px 0 94px}.hero-in>div{max-width:62%}}
.hero h1{color:#fff;font-size:clamp(2.05rem,6.4vw,3.55rem)}
.hero h1 em{font-style:normal;color:var(--knosk-gold)}
.hero-lead{color:rgba(255,255,255,.8);font-size:1.03rem;max-width:52ch;margin-top:14px}
.hero-mission{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding-left:14px;
  border-left:3px solid var(--knosk-gold);color:#fff;font-size:1rem;max-width:48ch}
/* the photo placeholder was eating a whole phone screen before the numbers */
.hero-btns{display:flex;flex-wrap:wrap;gap:11px;margin-top:24px}
.hero-btns .btn{flex:1 1 auto;min-width:170px}

/* campaign ribbon */
.camp{
  display:inline-flex;flex-wrap:wrap;align-items:center;gap:10px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  border-radius:999px;padding:7px 16px 7px 8px;margin-bottom:20px
}
.camp b{font-size:.8rem;font-weight:600;letter-spacing:.01em}
.camp .chip{background:var(--knosk-gold);color:#3A2A00;border-radius:999px;padding:3px 11px;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.camp .dates{font-size:.76rem;color:rgba(255,255,255,.66)}

/* hero photo slot */

/* ============ SCORECARD ============ */
.scorecard{margin-top:-38px;position:relative;z-index:20}
.card-sc{background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);padding:22px}
@media(min-width:760px){.card-sc{padding:30px 34px}}
.sc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 14px}
@media(min-width:760px){.sc-grid{grid-template-columns:repeat(4,1fr);gap:22px}}
.sc-item .eyebrow{margin-bottom:4px}
.sc-val{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,4.6vw,1.85rem);line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sc-item.is-goal .sc-val{color:var(--navy)}
.sc-item.is-raised .sc-val{color:var(--green)}
.sc-item.is-left .sc-val{color:var(--knosk-blue)}
.sc-item.is-pct .sc-val{color:var(--knosk-gold-600)}
.sc-sub{font-size:.72rem;color:var(--muted);margin-top:2px}

/* signature: ruled exercise-book progress meter */
.meter{margin-top:22px}
.meter-track{
  position:relative;height:34px;border-radius:8px;overflow:hidden;
  background:var(--paper-2);border:1px solid var(--line);
}
.meter-track::before{
  content:"";position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(to right,transparent 0 calc(10% - 1px),rgba(20,80,155,.22) calc(10% - 1px) 10%)
}
.meter-fill{
  position:absolute;inset:0 auto 0 0;border-radius:7px 3px 3px 7px;
  background:linear-gradient(90deg,var(--knosk-gold),#F7C441);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.07);
  transition:width .9s cubic-bezier(.22,1,.36,1)
}
.meter-fill::after{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--knosk-gold-600)}
.meter-pledged{position:absolute;inset:0 auto 0 0;border-radius:7px 3px 3px 7px;
  background:repeating-linear-gradient(135deg,var(--knosk-gold-100) 0 6px,#F3E0B0 6px 12px);
  transition:width .9s cubic-bezier(.22,1,.36,1)}
.meter-pledged::after{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--knosk-gold-600);opacity:.5}
.meter-key{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:.76rem;color:var(--muted)}
.meter-key i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.meter-key i.k-raised{background:var(--knosk-gold)}
.meter-key i.k-pledged{background:repeating-linear-gradient(135deg,var(--knosk-gold-100) 0 3px,#F3E0B0 3px 6px)}
.meter-key i.k-left{background:var(--paper-2);border:1px solid var(--line)}
.meter-legend{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:.74rem;color:var(--muted)}
.meter-fill.meter-pledge{background:repeating-linear-gradient(135deg,
  var(--knosk-blue-100) 0 5px, #CBD9EC 5px 10px);box-shadow:none}
.meter-fill.meter-pledge::after{background:var(--knosk-blue)}
.reg-cell.pledged{background:repeating-linear-gradient(135deg,
  var(--knosk-blue-100) 0 2px, #C3D3E8 2px 4px)}
.meter-sm .meter-track{height:12px;border-radius:6px}
.meter-sm .meter-track::before{display:none}
.meter-xs .meter-track{height:8px;border-radius:5px}

/* ============ SECTIONS ============ */
.sect{padding:56px 0}
@media(min-width:760px){.sect{padding:76px 0}}
.sect-tint{background:var(--knosk-blue-100)}
.sect-navy{background:var(--navy);color:#fff}
.sect-navy h2,.sect-navy h3{color:#fff}
.sect-paper2{background:var(--paper-2)}
.sect-head{max-width:64ch;margin-bottom:30px}
.sect-head p{color:var(--muted);font-size:1.02rem;margin-bottom:0}
.sect-navy .sect-head p{color:rgba(255,255,255,.74)}

/* the ₦100 explainer */
.explain{
  background:#fff;border:1px solid var(--line);border-left:4px solid var(--knosk-gold);
  border-radius:var(--r-lg);padding:26px 24px;box-shadow:var(--shadow)
}
@media(min-width:760px){.explain{padding:34px 36px}}
.explain h2{font-size:clamp(1.35rem,3.6vw,1.95rem);max-width:22ch}
.explain p{color:var(--muted);margin:14px 0 0;max-width:66ch;font-size:.97rem}
.explain .split{display:grid;gap:14px;margin-top:22px}
@media(min-width:700px){.explain .split{grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}}
.exp-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.exp-box .eyebrow{margin-bottom:6px}
.exp-box b{font-family:var(--display);font-size:1.28rem;display:block;line-height:1.2}
.exp-box span{font-size:.8rem;color:var(--muted);display:block;margin-top:4px}
.exp-vs{display:grid;place-items:center;font-size:.72rem;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}

/* ============ PILLAR CARDS ============ */
.pillars{display:grid;gap:18px}
@media(min-width:720px){.pillars{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.pillars{grid-template-columns:repeat(3,1fr)}}
.pillar{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);
  transition:box-shadow .2s ease,border-color .2s ease
}
.pillar:hover{box-shadow:var(--shadow-lg);border-color:#C9D6E8}
.pillar.feature{border-color:var(--knosk-gold);border-width:1.5px}
@media(min-width:1000px){.pillar.feature{grid-column:span 3;display:grid;grid-template-columns:1.15fr 1fr;gap:32px;align-items:start;padding:28px 30px}}
.pillar-top{display:flex;gap:12px;align-items:flex-start}
.p-ico{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--knosk-blue-100)}
.p-ico svg{width:21px;height:21px;stroke:var(--knosk-blue-700)}
.pillar h3{font-size:1.22rem}
.pillar .p-desc{color:var(--muted);font-size:.9rem;margin:6px 0 0}
.p-figs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.p-fig .eyebrow{font-size:.62rem;margin-bottom:2px}
.p-fig b{font-family:var(--display);font-size:1.02rem;font-weight:700;font-variant-numeric:tabular-nums;display:block;line-height:1.2}
.p-fig.raised b{color:var(--green)}
.p-fig.left b{color:var(--knosk-blue)}
.p-pct{display:flex;justify-content:space-between;align-items:baseline;font-size:.78rem;color:var(--muted);margin-bottom:6px}
.p-pct b{color:var(--knosk-gold-ink);font-size:.95rem;font-family:var(--display)}
.pillar-actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.tbc{
  display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--knosk-gold-ink);
  background:#FDF4E3;border:1px solid #F0DCB4;border-radius:999px;padding:3px 10px
}

/* register grid — signature element */
.register{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px
}
.reg-grid{display:grid;grid-template-columns:repeat(22,1fr);gap:3px}
@media(max-width:640px){.reg-grid{grid-template-columns:repeat(16,1fr)}}
.reg-cell{aspect-ratio:1;border-radius:2px;background:var(--line)}
.reg-cell.full{background:var(--knosk-gold)}
.reg-cell.part{background:var(--knosk-gold-100);box-shadow:inset 0 -100% 0 0 var(--knosk-gold)}
.reg-cell.part{background:linear-gradient(to top,var(--knosk-gold) 50%,var(--knosk-gold-100) 50%)}
.reg-key{display:flex;flex-wrap:wrap;gap:12px;margin-top:13px;font-size:.74rem;color:var(--muted)}
.reg-key i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.reg-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center}
.reg-stats div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 4px}
.reg-stats b{display:block;font-family:var(--display);font-size:1.25rem;line-height:1.1}
.reg-stats span{font-size:.66rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
/* sponsorship split at a glance */
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut svg{width:132px;height:132px;flex:none}
.donut-key{display:grid;gap:7px;font-size:.84rem;min-width:190px}
.donut-key div{display:flex;align-items:center;gap:9px}
.donut-key i{width:11px;height:11px;border-radius:3px;flex:none}
.donut-key b{font-variant-numeric:tabular-nums;margin-left:auto;font-family:var(--display);font-size:1.02rem}
/* bank transfer panel */
.bank{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.bank-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:.88rem}
.bank-row:last-of-type{border-bottom:0}
.bank-row span{color:var(--muted)}
.bank-row b{font-variant-numeric:tabular-nums;letter-spacing:.02em;text-align:right}
.bank-row b.acct{font-family:var(--display);font-size:1.15rem}

/* ============ GENERIC CARDS / TABLES ============ */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card-flat{box-shadow:none}
.card h3{margin-bottom:4px}
.cards-3{display:grid;gap:16px}
@media(min-width:700px){.cards-3{grid-template-columns:repeat(3,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.on-navy{background:var(--navy-800);border-color:rgba(255,255,255,.12)}
.stat.on-navy b{color:#fff}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:820px){.stats-grid{grid-template-columns:repeat(4,1fr)}}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:640px}
th{
  text-align:left;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--paper);white-space:nowrap
}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:.9rem}

}
.modal-hd h3{font-size:1.1rem;flex:1;min-width:0}

.x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}

.modal-bd{padding:20px}
.modal-ft{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px}

.steps i.done{background:var(--green)}

/* ============ RECEIPT ============ */

/* ============ FOOTER ============ */
.ftr{background:var(--navy);color:rgba(255,255,255,.72);padding:44px 0 34px;font-size:.88rem}
.ftr-grid{display:grid;gap:26px}

.ftr h4{font-family:var(--body);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);margin:0 0 10px;font-weight:700}

/* ============ CHILD DIRECTORY ============ */
/* full-bleed: escape the 1120px wrap and run edge to edge */

  transition:opacity .8s ease;will-change:opacity}

.band-slide::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(7,23,48,.28) 0%,rgba(7,23,48,0) 30%,rgba(7,23,48,.86) 100%)}

.band-dots{display:flex;gap:8px;align-items:center}
.band-dots button{width:34px;height:5px;border-radius:3px;border:0;padding:0;cursor:pointer;

.band-dots button.on{background:var(--knosk-gold)}
.band-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:42px;height:42px;
  border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(7,23,48,.45);
  color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px)}
.band-arrow:hover{background:rgba(7,23,48,.75)}
.band-arrow svg{width:19px;height:19px}
.band-arrow.prev{left:14px}.band-arrow.next{right:14px}
@media(max-width:640px){.band-arrow{display:none}}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}

.chip{

}

.list-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.list-head p{font-size:.82rem;margin:0}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:28px;flex-wrap:wrap}
.pg-arrow,.pg-num{border:1.5px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;

.pg-arrow svg{width:18px;height:18px}
.pg-arrow:hover:not([disabled]),.pg-num:hover{border-color:var(--knosk-blue);color:var(--knosk-blue-700)}

.pg-num.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pg-nums{display:flex;gap:6px;align-items:center}
.pg-gap{color:var(--muted);padding:0 2px}
.kids{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}

.kid{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .18s,transform .18s;text-align:left;padding:0;font:inherit;color:inherit}

.kid-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kid-class{flex:none;font-size:.66rem;font-weight:700;letter-spacing:.04em;color:var(--muted);

.kid-img{display:none}
.kid-img{overflow:hidden}

.kid-bd{padding:15px;display:flex;flex-direction:column;gap:9px;flex:1}

.kid-meta{font-size:.72rem;color:var(--muted);margin:0}
.kid-fig{font-size:.74rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}

.pres{background:var(--navy);min-height:100vh;color:#fff;padding:40px 0 60px}
.pres-grid{display:grid;gap:14px}

.pres-card{

.pres-card h4{font-family:var(--display);font-size:1.02rem;margin:0;font-weight:600}
.pres-card p{font-size:.79rem;color:rgba(255,255,255,.6);margin:0}

/* ============ TABS / ADMIN ============ */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;padding:11px 16px;border:0;background:none;cursor:pointer;font-size:.88rem;font-weight:500;
  color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap
}
.tab.on{color:var(--knosk-blue-700);border-bottom-color:var(--knosk-gold);font-weight:600}

.notice{

.notice b{display:block;margin-bottom:2px}
.notice p{margin:0}

.toast{

  background:var(--navy);color:#fff;padding:13px 20px;border-radius:999px;font-size:.86rem;
  box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px);text-align:center;

}

.demo-tag{
  display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;

}
.demo-bar{
  background:var(--knosk-gold-100);border-bottom:1px solid #F0DCB4;color:#6B4A00;

}
.demo-bar b{font-weight:700}

.crumb{font-size:.82rem;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:7px}

.crumb a:hover{color:var(--knosk-blue)}

.detail-list{list-style:none;padding:0;margin:0;columns:2;column-gap:20px;font-size:.85rem}

  flex:none;min-width:112px;font-variant-numeric:tabular-nums}
.impact-row span{font-size:.9rem;color:var(--muted)}
@media(max-width:560px){.impact-row{flex-direction:column;gap:2px}.impact-row b{min-width:0}}
.detail-list li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--knosk-gold);flex:none}

/* ============ PRINT ============ */
@media print{
  .hdr,.ftr,.no-print,.demo-bar,.mobnav{display:none!important}
  body{background:#fff}

  .rc-hd{background:#08182F!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sect{padding:0}
}

<script>
/* ============================================================================
   KNOSK GIVING HUB — core
   Phase 1: presentation-ready experience on a seeded in-memory data layer.
   Every read/write goes through DB.* so the layer can be swapped for
   Supabase/Postgres in Phase 2 without touching any view code.
   ========================================================================== */
'use strict';


/* ---------------------------------------------------------------------------
   2025/2026 RESULTS — from KNOSK's own Executive Report.
   Every figure here is reported by the school. Nothing is estimated or
   inflated, and nothing from the current session is mixed in: 2026/2027
   giving stands at zero and is shown separately.

   ⚠ The report carries a student spotlight naming a child, her age and her
   home town. That is not reproduced here — on a public page, age plus home
   town plus boarding status identifies a minor far more precisely than a name
   in the sponsorship directory does.
   ------------------------------------------------------------------------- */
const IMPACT_2025 = {
  session: '2025/2026',
  headline: [

    ['14 / 14', 'pioneers passed WAEC & NECO with 5 credits'],

    ['22', 'schools joined the Kuje AI Bootcamp']
  ],
  sections: [

      title: 'Access', pillar: 'sponsorship',
      lead: 'KNOSK opened the session with its largest JSS 1 intake yet.',
      stats: [
        ['51', 'new JSS 1 students admitted, 8 September 2025'],
        ['31 / 20', 'girls / boys in that intake'],
        ['10', 'girls won ₦240,000 Osasu Show scholarships']
      ],
      note: 'The intake included the school\'s first student admitted from outside the Federal Capital Territory.'
    },
    {
      title: 'Academic outcomes', pillar: 'teachers',
      lead: 'The pioneer cohort completed the full six-year journey in September 2025 — the first real test of the model.',
      stats: [
        ['14 / 14', 'achieved five WAEC & NECO credits including Maths and English, at one sitting'],
        ['9 girls · 5 boys', 'in the pioneer graduating class'],
        ['5', 'won Mastercard Foundation scholarships to Pan-Atlantic University, worth about ₦200m'],
        ['3', 'university sponsorship offers from the graduation'],
        ['25', 'students sat WAEC and NECO in the second cohort, 2026']
      ]
    },
    {
      title: 'Technology', pillar: 'operations',
      lead: 'An ICT, AI and CBT Centre moved digital learning from aspiration to infrastructure.',
      stats: [
        ['35', 'laptops installed, solar-powered, a facility of about ₦42m'],
        ['1 of ~400', 'schools nationwide accredited by WAEC to run CBT examinations from 2026'],
        ['5', 'donated containers, including three from Julius Berger Nigeria']
      ],
      note: 'A Student Solution Hackathon asked students to find problems in their own school and build answers to them.'
    },
    {
      title: 'Beyond our classrooms', pillar: 'teachers',
      lead: 'The clearest sign of the year: the model started working for children who are not KNOSK students.',
      stats: [
        ['7', 'public schools sent teachers to the Enrichment Programme, 2 July 2026'],
        ['22', 'secondary schools joined a free ten-day AI Bootcamp for ages 11–17'],

      ],

};

/* ---------------------------------------------------------------------------
   MONEY
   Stored as INTEGER KOBO. Never floats. 1 naira = 100 kobo.
   ------------------------------------------------------------------------- */
const K = n => Math.round(n * 100);              // naira -> kobo (seed input only)
const naira = kobo => Math.round(kobo / 100);

function money(kobo, opts) {
  opts = opts || {};
  if (kobo == null) return '—';
  const n = naira(kobo);
  if (opts.compact && Math.abs(n) >= 1000000) {
    const m = n / 1000000;
    return '₦' + (m % 1 === 0 ? m : m.toFixed(2).replace(/0$/, '')) + 'm';
  }
  if (opts.compact && Math.abs(n) >= 1000) {
    return '₦' + Math.round(n / 1000) + 'k';
  }
  return '₦' + n.toLocaleString('en-NG');
}
const pct = (part, whole) => (!whole || whole <= 0) ? 0 : Math.min(100, Math.round((part / whole) * 1000) / 10);
const clampPct = v => Math.max(0, Math.min(100, v));

/* ---------------------------------------------------------------------------
   ORGANISATION SETTINGS  (Admin → Settings edits these at runtime)
   ------------------------------------------------------------------------- */
/* Flipped to true by make-public-build.py. A public build has the admin area
   removed and admission numbers stripped out of the roster, because anything
   shipped to GitHub Pages is readable by anyone who views the page source. */
const PUBLIC_BUILD = false;

/* Last session's sponsorship rate. Every carried-over sponsor gave at this. */
const PRIOR_RATE = K(240000);

const SETTINGS = {
  orgName: 'KNOSK ₦100-a-Day Charity Secondary School',
  orgShort: 'KNOSK',
  platformName: 'KNOSK Giving Hub',
  descriptor: 'Giving that keeps opportunity within reach.',
  location: 'Kuje, Abuja, Nigeria',

  /* OFFICIAL LOGO -------------------------------------------------------
     The supplied KNOSK artwork, embedded as a data URI so the single file
     stays self-contained and works offline and over WhatsApp. Surrounding
     whitespace was trimmed; the artwork itself is unaltered and undistorted.
     To swap it for a hosted copy, replace this with a URL — here or in
     Admin → Settings. knosk-logo.jpg is included alongside this file.    */
  /* Point this at the donations server (server/server.js) to take real
     payments. Blank = fully local demo, nothing leaves the browser. */
  apiBase: '',

  /* full = "Jemimah Samuel" · first = "Jemimah" · anonymous = "Child 037" */
  nameDisplay: 'full',

/* net public requirement for a pillar */
function netRequirement(p) {
  if (p.majorGiftOnly || p.grossCost == null) return null;
  return Math.max(0, p.grossCost - (p.fundedFromSponsorship || 0) - (p.fundedFromOther || 0));
}

/* ---------------------------------------------------------------------------
   DETERMINISTIC PRNG so the demo looks identical at every presentation
   ------------------------------------------------------------------------- */
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ------------------------- WRITES ------------------------- */
function addDonor(d) {
  const donor = {
    id: uid('dnr'), name: d.name, email: (d.email || '').trim().toLowerCase(),
    phone: d.phone || '', anonymous: !!d.anonymous, createdISO: todayISO()
  };
  DB.donors.push(donor);
  return donor;
}

/** Find by email, otherwise create. This is the whole point of the Hub (§29). */
function findOrCreateDonor({ name, email, phone, anonymous }) {
  const key = (email || '').trim().toLowerCase();
  let donor = DB.donors.find(x => x.email === key);
  let created = false;
  if (!donor) { donor = addDonor({ name, email: key, phone, anonymous }); created = true; }
  else {
    if (phone && !donor.phone) donor.phone = phone;
    if (name && donor.name !== name) donor.altNames = [...new Set([...(donor.altNames || []), name])];
  }
  return { donor, created };
}

function nextReceiptNo() {
  DB._receiptSeq++;
  return 'KNOSK-2026-' + String(DB._receiptSeq).padStart(6, '0');
}

/**
 * The single write path for BOTH online and offline giving.
 * Creates Payment → Donation → DonationAllocation (→ SponsorshipAllocation) → Receipt.
 * Payment = how money arrived. Donation = what the giver intended.
 * Allocation = where KNOSK designated it. Kept deliberately distinct (§40).
 */
function recordDonation(o) {
  const donor = DB.donors.find(d => d.id === o.donorId);
  if (!donor) throw new Error('Unknown donor');
  const dateISO = o.dateISO || todayISO();

  const payment = {
    id: uid('pay'), donorId: donor.id, amountKobo: o.amountKobo, currency: 'NGN',
    method: o.method, channel: o.channel, reference: o.reference || uid('ref').toUpperCase(),
    status: 'success', verifiedServerSide: o.channel === 'online' ? 'demo' : 'n/a',
    dateISO, recordedBy: o.recordedBy || (o.channel === 'offline' ? 'KNOSK staff' : 'Paystack (demo)')
  };
  DB.payments.push(payment);

  const donation = {
    id: uid('don'), donorId: donor.id, paymentId: payment.id, campaignId: CAMPAIGN.id,
    amountKobo: o.amountKobo, currency: 'NGN', pillarId: o.pillarId, childId: o.childId || null,
    note: o.note || '', anonymous: !!o.anonymous, dateISO, status: 'confirmed'
  };
  DB.donations.push(donation);

  DB.allocations.push({
    id: uid('alc'), donationId: donation.id, pillarId: o.pillarId,
    childId: o.childId || null, amountKobo: o.amountKobo, dateISO
  });

  if (o.childId) {
    const child = DB.children.find(c => c.id === o.childId);
    if (child) {
      const room = Math.max(0, child.goal - child.funded);
      const applied = o.allowOverfund ? o.amountKobo : Math.min(o.amountKobo, room);
      child.funded += applied;
      DB.sponsorships.push({
        id: uid('spa'), childId: child.id, donorId: donor.id, donationId: donation.id,
        amountKobo: applied, dateISO
      });
    }
  }

  const receipt = {
    id: uid('rcp'), no: nextReceiptNo(), donationId: donation.id, donorId: donor.id,
    amountKobo: o.amountKobo, currency: 'NGN', dateISO, pillarId: o.pillarId,
    childId: o.childId || null, method: o.method, reference: payment.reference
  };
  DB.receipts.push(receipt);

  DB.auditLog.push({
    id: uid('log'), dateISO, actor: payment.recordedBy,
    action: o.channel === 'offline' ? 'Recorded offline donation' : 'Recorded online donation',
    detail: `${money(o.amountKobo)} · ${donor.email} · ${pillarName(o.pillarId)}`
  });

  return { donation, payment, receipt, donor };
}

/* ------------------------- DERIVED READS ------------------------- */
const pillarById = id => PILLARS.find(p => p.id === id);
const pillarName = id => (pillarById(id) || {}).name || '—';
const childById = id => DB.children.find(c => c.id === id);

/* The roster arrives in two formats. 123 rows are "Surname, Given" and 53 are
   plain with the name order unclear, so a given name can only be extracted
   reliably from the comma rows. prettyName turns "Surname, Given" into
   "Given Surname" and leaves the plain rows exactly as written.            */
function prettyName(full) {
  if (!full) return '';
  const i = full.indexOf(',');
  if (i === -1) return full.trim();
  return (full.slice(i + 1).trim() + ' ' + full.slice(0, i).trim()).replace(/\s+/g, ' ');
}
/* Given name only — reliable for comma rows, so plain rows keep the full name
   rather than guessing which token is the given name. */
function givenName(full) {
  if (!full) return '';
  if (full.indexOf(',') === -1) return full.trim();
  return full.split(',')[1].trim().split(/\s+/)[0];
}
function nameIsAmbiguous(full) { return !!full && full.indexOf(',') === -1; }

/* Public label. SETTINGS.nameDisplay sets the house rule; a child whose family
   has asked to be left out is switched off individually with publishName. */
function childName(c) {
  if (!c) return '';
  const anon = 'Child ' + c.ref.slice(3);
  if (!c.fullName || c.publishName === false) return anon;
  switch (SETTINGS.nameDisplay) {
    case 'anonymous': return anon;
    case 'first':     return givenName(c.fullName);
    default:          return prettyName(c.fullName);
  }
}
/* Admin-side label: real name plus the public reference. Never call in public views. */
function childAdminName(c) { return c.fullName ? prettyName(c.fullName) : childName(c); }

function raisedFor(pillarId) {
  return DB.allocations.filter(a => a.pillarId === pillarId).reduce((s, a) => s + a.amountKobo, 0);
}
/* Every pledge counts as pledged. None of it counts as raised. */
function pledgedFor(pillarId) {
  return DB.pledges.filter(p => p.pillarId === pillarId)
    .reduce((s, p) => s + p.amountKobo, 0);
}
/** Sponsorship raised includes money already received before the Hub launched. */
function sponsorshipRaised() {
  return DB.sponsorships.reduce((s, a) => s + a.amountKobo, 0);
}

function pillarStats(p) {
  const goal = netRequirement(p);
  const raised = p.id === 'sponsorship' ? sponsorshipRaised() : raisedFor(p.id);
  const pledged = pledgedFor(p.id);
  const left = goal == null ? null : Math.max(0, goal - raised);
  return {
    goal, raised, pledged, left,
    percent: goal == null ? null : pct(raised, goal),
    gapAfterPledges: goal == null ? null : Math.max(0, goal - raised - pledged)
  };
}

/** Public scorecard. Sums NET requirements only — never gross costs. */
/* Child Sponsorship is a way of FUNDING the school year, not an extra cost on
   top of it. Teaching, meals and operations are what the year actually costs.
   So the operating total deliberately excludes sponsorship — adding it would
   double count the very same classrooms, meals and salaries. */
const OPERATING_PILLARS = ['teachers', 'operations', 'feeding'];
function operatingCost() {
  return PILLARS.filter(p => OPERATING_PILLARS.includes(p.id))
    .reduce((t, p) => t + (p.grossCost || 0), 0);
}

function overallStats() {
  let raised = 0, pledged = 0, unconfirmed = 0, pillarGoalSum = 0;
  PILLARS.forEach(p => {
    const s = pillarStats(p);
    raised += s.raised; pledged += s.pledged;
    if (s.goal == null) return;
    pillarGoalSum += s.goal;
    if (!p.targetConfirmed) unconfirmed++;
  });

  /* The published goal is KNOSK's confirmed annual budget, not a sum of
     pillar targets. Every naira given — to any pillar, online or offline —
     counts toward that one number. */
  const goal = SETTINGS.annualBudgetConfirmed
    ? SETTINGS.annualBudget
    : pillarGoalSum;

  return {
    goal, raised, pledged,
    left: Math.max(0, goal - raised),
    percent: pct(raised, goal),
    unconfirmedTargets: unconfirmed,
    budgetConfirmed: !!SETTINGS.annualBudgetConfirmed,
    pillarGoalSum,
    operatingCost: operatingCost(),
    sponsorshipCapacity: pillarById('sponsorship').grossCost,
    /* budget not yet broken down into pillars */
    unallocated: SETTINGS.annualBudget - operatingCost(),
    grossProgramme: PILLARS.reduce((s, p) => s + (p.grossCost || 0), 0)
  };
}

/* Student count and the sponsorship target both follow the roster, so adding
   the outstanding SS 1 admissions updates every public figure automatically. */
function syncRoster() {
  const live = DB.children.filter(c => !c.archived);
  SETTINGS.students = live.length;
  pillarById('sponsorship').grossCost = live.reduce((t, c) => t + c.goal, 0);
}

/* KNOSK decision: every child carries the same annual goal, no exceptions.
   A rate change applies across the whole roster, including children who
   already have money against them — those simply become part-sponsored again
   against the higher goal. */
function applySponsorshipRate() {
  DB.children.forEach(c => { c.goal = SETTINGS.sponsorshipAnnual; });
  syncRoster();
}

function childStatus(c) {
  if (c.funded >= c.goal) return 'full';
  if (c.funded > 0) return 'part';
  if (c.pledgedKobo > 0) return 'pledged';   // last year's sponsor, expected to renew
  return 'waiting';
}
function childCounts() {
  const o = { full: 0, part: 0, pledged: 0, waiting: 0 };
  DB.children.forEach(c => o[childStatus(c)]++);
  return o;
}
const STATUS_LABEL = {
  full: 'Fully sponsored', part: 'Part sponsored',
  pledged: 'Sponsor expected', waiting: 'Needs a sponsor'
};
const STATUS_BADGE = { full: 'b-green', part: 'b-gold', pledged: 'b-blue', waiting: 'b-grey' };

function donorStats(donorId) {
  const ds = DB.donations.filter(d => d.donorId === donorId);
  const lifetime = ds.reduce((s, d) => s + d.amountKobo, 0);
  const pillars = [...new Set(ds.map(d => d.pillarId))];
  const kids = [...new Set(DB.sponsorships.filter(s => s.donorId === donorId).map(s => s.childId))];
  return { donations: ds, lifetime, thisYear: lifetime, pillars, children: kids };
}

  paystack_card: 'Paystack Card',

/* ---------------------------------------------------------------------------
   PAYSTACK SERVICE LAYER — architecture only, running in DEMO MODE.
   No key of any kind appears in this file. In production the browser calls
   your own server; the server holds PAYSTACK_SECRET_KEY as an env var,
   initialises the transaction, and verifies it server-side / by webhook.
   A browser redirect is NEVER treated as proof of payment.
   ------------------------------------------------------------------------- */
const PaystackService = {
  isConfigured() { return !!SETTINGS.apiBase; },

  buildMetadata(o) {
    return {
      donor_id: o.donorId, donor_email: o.email, pillar_id: o.pillarId,
      campaign_id: CAMPAIGN.id, child_id: o.childId || null,
      internal_reference: o.internalRef
    };
  },

  /* With apiBase set, the server creates/matches the donor account, records a
     pending donation and asks Paystack for a checkout URL. The secret key
     lives only on that server. Without apiBase, everything stays local. */
  async initialise(o) {
    if (!this.isConfigured()) {
      const internalRef = 'KNOSK-' + Date.now().toString(36).toUpperCase();
      return { demo: true, reference: internalRef, metadata: this.buildMetadata({ ...o, internalRef }) };
    }
    const r = await fetch(SETTINGS.apiBase + '/api/donations/initialise', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: o.name, email: o.email, phone: o.phone,
        amountNaira: naira(o.amountKobo), pillarId: o.pillarId,
        childId: o.childId || null, note: o.note, anonymous: o.anonymous,
        campaignId: CAMPAIGN.id
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Could not start the payment');
    return data;   // { reference, authorization_url, donorCreated, ... }
  },

  /* Never trusts the browser redirect. Asks our server, which asks Paystack. */
  async verify(reference) {
    if (!this.isConfigured()) {
      await new Promise(r => setTimeout(r, 900));
      return { status: 'success', reference, verified: 'DEMO — not verified with Paystack' };
    }
    const r = await fetch(SETTINGS.apiBase + '/api/donations/verify?reference=' + encodeURIComponent(reference));
    return await r.json();
  },

  /* Passwordless sign-in for the donor dashboard. */
  async requestMagicLink(email) {
    if (!this.isConfigured()) return { sent: false, error: 'No server configured' };
    const r = await fetch(SETTINGS.apiBase + '/api/auth/magic-link', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    return await r.json();
  }
};

/* sponsorship split as a donut — the whole picture in one glance */
function donut(cc) {
  const total = cc.full + cc.part + cc.waiting || 1;
  const segs = [
    ['Fully sponsored', cc.full, 'var(--knosk-gold)'],
    ['Part sponsored', cc.part, 'var(--knosk-gold-100)'],
    ['Sponsor expected to renew', cc.pledged, 'var(--knosk-blue-100)'],
    ['Needs a sponsor', cc.waiting, '#D8DFE9']
  ];
  const C = 2 * Math.PI * 54;
  let off = 0;
  const rings = segs.map(([, n, col]) => {
    const len = (n / total) * C;
    /* var() is not valid in SVG presentation attributes — must go via style */
    const el = `<circle cx="70" cy="70" r="54" fill="none" stroke-width="22"
      style="stroke:${col}" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}"
      transform="rotate(-90 70 70)"></circle>`;
    off += len; return el;
  }).join('');
  return `<div class="donut">
    <svg viewBox="0 0 140 140" role="img" aria-label="${cc.full} fully sponsored, ${cc.part} partly sponsored, ${cc.waiting} still waiting">
      ${rings}
      <text x="70" y="66" text-anchor="middle" font-size="26" font-weight="700"
        style="font-family:var(--display);fill:var(--navy)">${total}</text>
      <text x="70" y="84" text-anchor="middle" font-size="9" letter-spacing="1.4"
        style="fill:var(--muted)">CHILDREN</text>
    </svg>
    <div class="donut-key">
      ${segs.map(([l, n, col]) => `<div><i style="background:${col}"></i>${l}<b>${n}</b></div>`).join('')}
    </div>
  </div>`;
}

/* ============================================================================
   MODAL PRIMITIVE
   ========================================================================== */
let _modalCleanup = null;
function openModal({ title, step, steps, body, footer, wide }) {
  const root = $('#modal-root');
  root.innerHTML = `
  <div class="ov" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal ${wide ? 'modal-wide' : ''}">
      <div class="modal-hd">
        <h3>${esc(title)}</h3>
        ${step ? `<span class="step">${esc(step)}</span>` : ''}
        <button class="x" data-close aria-label="Close">${icon('x')}</button>
      </div>
      ${steps ? `<div class="steps">${steps.map(s => `<i class="${s}"></i>`).join('')}</div>` : ''}
      <div class="modal-bd">${body}</div>
      ${footer ? `<div class="modal-ft">${footer}</div>` : ''}
    </div>
  </div>`;
  document.body.style.overflow = 'hidden';
  const ov = root.querySelector('.ov');
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeModal(); });
  const onKey = e => { if (e.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', onKey);
  _modalCleanup = () => document.removeEventListener('keydown', onKey);
  const first = root.querySelector('.inp,.btn,.amt');
  if (first && window.innerWidth > 640) first.focus();
}
function closeModal() {
  $('#modal-root').innerHTML = '';
  document.body.style.overflow = '';
  if (_modalCleanup) { _modalCleanup(); _modalCleanup = null; }
}


/* ---------------------------------------------------------------------------
   SPONSORSHIP BANNER SLIDER
   Full-bleed, cross-fading. Auto-advance stops the moment anyone touches a
   control, and never starts at all if the visitor prefers reduced motion.
   ------------------------------------------------------------------------- */
function sponsorBand() {
  const slides = SETTINGS.sponsorSlides || [];
  if (!slides.length) return '';
  const many = slides.length > 1;
  const arrow = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"><path d="${d === 'prev' ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7'}"/></svg>`;
  return `<div class="band" id="band" role="region" aria-label="KNOSK students">
    <div class="band-track">
      ${slides.map((sl, i) => `<div class="band-slide ${i === 0 ? 'on' : ''}"
        style="background-image:url(${sl.src});background-position:${esc(sl.pos || '50% 45%')}"
        role="img" aria-label="${esc(sl.alt)}" data-slide="${i}"></div>`).join('')}
    </div>
    ${many ? `<button class="band-arrow prev" data-band="-1" aria-label="Previous photo">${arrow('prev')}</button>
    <button class="band-arrow next" data-band="1" aria-label="Next photo">${arrow('next')}</button>` : ''}
    <div class="band-cap"><div class="wrap">
      <div><b id="bandTitle">${esc(slides[0].title)}</b>
        <span id="bandCap">${esc(slides[0].caption)}</span></div>
      ${many ? `<div class="band-dots" role="tablist" aria-label="Choose photo">
        ${slides.map((sl, i) => `<button class="${i === 0 ? 'on' : ''}" data-banddot="${i}"
          role="tab" aria-label="${esc(sl.title)}" aria-selected="${i === 0}"></button>`).join('')}
      </div>` : ''}
    </div></div>
  </div>`;
}

let _bandIx = 0, _bandTimer = null;
function bandGo(n, manual) {
  const slides = SETTINGS.sponsorSlides || [];
  const els = document.querySelectorAll('.band-slide');
  if (!els.length) return;
  _bandIx = (n + slides.length) % slides.length;
  els.forEach((el, i) => el.classList.toggle('on', i === _bandIx));
  document.querySelectorAll('[data-banddot]').forEach((b, i) => {
    b.classList.toggle('on', i === _bandIx);
    b.setAttribute('aria-selected', i === _bandIx);
  });
  const t = $('#bandTitle'), c = $('#bandCap');
  if (t) t.textContent = slides[_bandIx].title;
  if (c) c.textContent = slides[_bandIx].caption;
  if (manual) bandStop();
}
function bandStop() { if (_bandTimer) { clearInterval(_bandTimer); _bandTimer = null; } }
function bandStart() {
  bandStop();
  const slides = SETTINGS.sponsorSlides || [];
  if (slides.length < 2) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  _bandTimer = setInterval(() => bandGo(_bandIx + 1), 6500);
}

function renderKids() {
  const host = $('#kidlist'); if (!host) return;
  const order = { waiting: 0, part: 1, pledged: 2, full: 3 };
  let list = DB.children.filter(c => !c.archived)
    .filter(c => _filter === 'all' ? true : childStatus(c) === _filter)
    .filter(c => _class === 'all' ? true : c.klass === _class)
    .sort((a, b) => order[childStatus(a)] - order[childStatus(b)] || a.ref.localeCompare(b.ref));

  if (!list.length) {
    host.innerHTML = `<div class="card center"><p class="muted" style="margin:0">
      No children match this filter. Try “All Children”.</p></div>`;
    return;
  }
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (_page > pages) _page = pages;
  if (_page < 1) _page = 1;
  const from = (_page - 1) * PAGE_SIZE;
  const shown = list.slice(from, from + PAGE_SIZE);

  const arrow = dir => `<path d="${dir === 'prev' ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7'}"/>`;
  const nav = pages > 1 ? `
    <nav class="pager" aria-label="Sponsorship directory pages">
      <button class="pg-arrow" data-page="${_page - 1}" ${_page === 1 ? 'disabled' : ''} aria-label="Previous page">

          stroke-linecap="round" stroke-linejoin="round">${arrow('prev')}</svg></button>
      <span class="pg-nums">
        ${Array.from({ length: pages }, (_, i) => i + 1)
        .filter(n => n === 1 || n === pages || Math.abs(n - _page) <= 1)
        .map((n, i, arr) => (i && n - arr[i - 1] > 1 ? '<span class="pg-gap">…</span>' : '') +
          `<button class="pg-num ${n === _page ? 'on' : ''}" data-page="${n}">${n}</button>`).join('')}

          stroke-linecap="round" stroke-linejoin="round">${arrow('next')}</svg></button>

  host.innerHTML = `
    <div class="list-head">
      <p class="muted">Showing <b>${from + 1}–${from + shown.length}</b> of
        <b>${list.length}</b>${_filter === 'all' && _class === 'all' ? ' children' : ' matching children'}</p>

const GIVE = { step: 0, pillarId: null, childId: null, amount: 0, name: '', email: '', phone: '', note: '', anonymous: false, method: 'paystack_card', result: null };

function startGive(pillarId, childId) {
  Object.assign(GIVE, { step: pillarId ? 1 : 0, pillarId: pillarId || null, childId: childId || null, amount: 0, result: null });

}

function stepBar(active) {
  return ['Choose', 'Amount', 'Details', 'Payment', 'Done']
    .map((_, i) => i < active ? 'done' : i === active ? 'on' : '');
}

function renderGive() {
  const s = GIVE.step;
  if (s === 0) return giveChoose();
  if (s === 1) return giveAmount();
  if (s === 2) return giveDetails();
  if (s === 3) return givePayment();
  if (s === 4) return giveDone();
}

async function doPay() {
  const btn = $('#payBtn'); if (!btn) return;
  btn.disabled = true; btn.textContent = 'Verifying payment…';

  let init;
  try {
    init = await PaystackService.initialise({
      donorId: null, email: GIVE.email, name: GIVE.name, phone: GIVE.phone,
      amountKobo: GIVE.amount, pillarId: GIVE.pillarId, childId: GIVE.childId,
      note: GIVE.note, anonymous: GIVE.anonymous
    });
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Try again';
    toast(e.message); return;
  }
  /* Live mode: hand off to the Paystack checkout. The server confirms the
     gift by webhook whether or not the giver ever comes back to this tab. */
  if (init.authorization_url) { window.location.href = init.authorization_url; return; }

  const v = await PaystackService.verify(init.reference);
  if (v.status !== 'success') { btn.disabled = false; btn.textContent = 'Try again'; return; }

  const { donor, created } = findOrCreateDonor({ name: GIVE.name, email: GIVE.email, phone: GIVE.phone, anonymous: GIVE.anonymous });
  const res = recordDonation({
    donorId: donor.id, amountKobo: GIVE.amount, pillarId: GIVE.pillarId, childId: GIVE.childId,
    method: GIVE.method, channel: 'online', note: GIVE.note, anonymous: GIVE.anonymous,
    reference: init.reference
  });
  DB.session.donorId = donor.id;
  GIVE.result = { ...res, createdDonor: created };
  GIVE.step = 4;
  renderGive();
}

/* validation helpers */
function readAmountStep() {
  const el = $('#gAmt'), err = $('#gAmtErr');
  const v = K(parseInt(String(el.value).replace(/[^0-9]/g, ''), 10) || 0);
  if (!v || v < K(500)) { err.hidden = false; el.focus(); return false; }
  GIVE.amount = v; return true;
}
function readDetailsStep() {
  let ok = true;
  const n = $('#gName'), e = $('#gEmail');
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e.value.trim());
  $('#gNameErr').hidden = !!n.value.trim();
  $('#gEmailErr').hidden = emailOk;
  if (!n.value.trim()) ok = false;
  if (!emailOk) ok = false;
  GIVE.name = n.value.trim(); GIVE.email = e.value.trim();
  GIVE.phone = $('#gPhone').value.trim(); GIVE.note = $('#gNote').value.trim();
  GIVE.anonymous = $('#gAnon').checked;
  return ok;
}

      <div class="crumb"><a href="#/">Giving Hub</a> <span>/</span> <span>Admin</span></div>

      <div class="notice warn" style="margin-top:18px">${icon('info')}

function viewAdmin() { return adminShell(adminTabBody()); }

/* Public builds carry no admin area at all. This is not a hidden page — the
   staff data simply is not in the file. */

  return page('', `<section class="sect"><div class="wrap wrap-narrow">
    <span class="eyebrow">KNOSK staff</span>
    <h1 style="font-size:clamp(1.5rem,4.4vw,2.1rem)">The admin area is not part of this site</h1>

}

function adminTabBody() {
  switch (_adminTab) {
    case 'donations': return adminDonations();
    case 'donors': return adminDonors();
    case 'children': return adminChildren();
    case 'budget': return adminBudget();
    case 'pledges': return adminPledges();
    case 'settings': return adminSettings();
    case 'audit': return adminAudit();
    default: return adminOverview();
  }
}

function adminOverview() {
  const o = overallStats(), cc = childCounts();
  const online = DB.payments.filter(p => p.channel === 'online').reduce((s, p) => s + p.amountKobo, 0);
  const offline = DB.payments.filter(p => p.channel === 'offline').reduce((s, p) => s + p.amountKobo, 0);
  const pledges = DB.pledges.reduce((s, p) => s + p.amountKobo, 0);
  const gap = Math.max(0, o.goal - o.raised - pledges);

  const cards = [
    ['Annual budget', money(SETTINGS.annualBudget), 'Confirmed — the published goal'],
    ['Total confirmed giving', money(o.raised), 'Received and allocated'],
    ['Online giving', money(online), DB.payments.filter(p => p.channel === 'online').length + ' payments'],
    ['Offline giving', money(offline), DB.payments.filter(p => p.channel === 'offline').length + ' payments'],
    ['Pledged, not received', money(pledges), 'Last year\'s sponsors, awaiting renewal'],
    ['Donors', String(DB.donors.length), 'Unique giving records'],
    ['Children fully sponsored', String(cc.full), 'of ' + SETTINGS.students],
    ['Children part sponsored', String(cc.part), 'Partial year covered'],
    ['Children still waiting', String(cc.waiting), 'No sponsorship yet'],
    ['Current funding gap', money(gap), 'After pledges']
  ];

  return `
  <div class="stats-grid" style="grid-template-columns:repeat(2,1fr)">
    ${cards.map(c => `<div class="stat"><span class="eyebrow">${esc(c[0])}</span><b>${esc(c[1])}</b>
      <span class="muted" style="font-size:.74rem">${esc(c[2])}</span></div>`).join('')}
  </div>

  <h3 style="margin-top:34px">Pillar position</h3>
  <p class="muted" style="font-size:.85rem;margin-top:4px">Gross cost, what sponsorship and other sources already cover, and the net requirement the public sees.</p>
  <div class="tbl-wrap" style="margin-top:12px">
    <table><thead><tr>
      <th>Pillar</th><th class="num">Gross cost</th><th class="num">From sponsorship</th>
      <th class="num">Other sources</th><th class="num">Net requirement</th>
      <th class="num">Received</th><th class="num">Pledged</th><th class="num">Gap</th>
    </tr></thead><tbody>
    ${PILLARS.map(p => {
      const s = pillarStats(p);
      return `<tr>
        <td><b>${esc(p.name)}</b>${p.targetConfirmed ? '' : tag('unconfirmed')}</td>
        <td class="num">${p.grossCost == null ? '—' : money(p.grossCost)}</td>
        <td class="num muted">${money(p.fundedFromSponsorship)}</td>
        <td class="num muted">${money(p.fundedFromOther)}</td>
        <td class="num"><b>${s.goal == null ? '—' : money(s.goal)}</b></td>
        <td class="num" style="color:var(--green)">${money(s.raised)}</td>
        <td class="num">${money(s.pledged)}</td>
        <td class="num" style="color:var(--knosk-blue)">${s.gapAfterPledges == null ? '—' : money(s.gapAfterPledges)}</td>
      </tr>`;
    }).join('')}
    <tr style="background:var(--paper)">
      <td><b>Public total</b></td>
      <td class="num">${money(o.grossProgramme)}</td>
      <td class="num muted" colspan="2">covered elsewhere</td>
      <td class="num"><b>${money(o.goal)}</b></td>
      <td class="num" style="color:var(--green)"><b>${money(o.raised)}</b></td>
      <td class="num"><b>${money(o.pledged)}</b></td>
      <td class="num"><b>${money(gap)}</b></td>
    </tr>
    </tbody></table>
  </div>
  <div class="notice ok" style="margin-top:16px">${icon('info')}
    <div><b>Pillar targets reconcile to the school-focused cost</b>
    <p>Every pillar target is derived from KNOSK's cost one-pager:
      ${money(SETTINGS.costPerChild)} per child × ${SETTINGS.students} =
      <b>${money(SETTINGS.annualBudget)}</b>. Teaching ${money(pillarById('teachers').grossCost)},
      operations ${money(pillarById('operations').grossCost)}, meals
      ${money(pillarById('feeding').grossCost)}. Sponsorship covers
      ${pct(SETTINGS.sponsorshipAnnual, SETTINGS.costPerChild)}% of each, so the net targets plus
      the ${money(pillarById('sponsorship').grossCost)} sponsorship ask sum to the total exactly
      once. KCEI's wider ${money(SETTINGS.kceiTotalBudget)} programme budget is deliberately
      outside this goal, as are boarding and examination fees.</p></div></div>

  <div class="notice" style="margin-top:12px">${icon('info')}
    <div><b>The public total is never the sum of gross costs</b>
    <p>Sponsorship income already covers part of teaching, meals and operations. Only the net
      requirement column is summed into the public goal, so nothing is counted twice.</p></div></div>`;
}

function adminDonations() {
  let rows = DB.donations.slice().sort((a, b) => b.dateISO.localeCompare(a.dateISO));
  const q = _donFilter.q.toLowerCase();
  rows = rows.filter(d => {
    const donor = DB.donors.find(x => x.id === d.donorId) || {};
    const pay = DB.payments.find(p => p.id === d.paymentId) || {};
    const rc = DB.receipts.find(r => r.donationId === d.id) || {};
    if (_donFilter.pillar !== 'all' && d.pillarId !== _donFilter.pillar) return false;
    if (_donFilter.channel !== 'all' && pay.channel !== _donFilter.channel) return false;
    if (!q) return true;
    return [donor.name, donor.email, pay.reference, rc.no, pillarName(d.pillarId)]
      .join(' ').toLowerCase().includes(q);
  });

  return `
  <div class="card card-flat" style="padding:16px;margin-bottom:16px">
    <div class="fgrid fgrid-2">
      <div class="field" style="margin-bottom:8px"><label for="dq">Search donor, email, reference or receipt</label>
        <input class="inp" id="dq" value="${esc(_donFilter.q)}" placeholder="e.g. amina or KNOSK-2026-000001"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="field" style="margin-bottom:8px"><label for="dp">Pillar</label>
          <select class="inp" id="dp"><option value="all">All pillars</option>
            ${PILLARS.map(p => `<option value="${p.id}" ${_donFilter.pillar === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
        <div class="field" style="margin-bottom:8px"><label for="dc">Channel</label>
          <select class="inp" id="dc">
            <option value="all">Online and offline</option>
            <option value="online" ${_donFilter.channel === 'online' ? 'selected' : ''}>Online only</option>
            <option value="offline" ${_donFilter.channel === 'offline' ? 'selected' : ''}>Offline only</option></select></div>
      </div>
    </div>
  </div>
  <p class="muted" style="font-size:.84rem">${rows.length} donation${rows.length === 1 ? '' : 's'} · ${money(rows.reduce((s, d) => s + d.amountKobo, 0))}</p>
  <div class="tbl-wrap" style="margin-top:10px">
    <table><thead><tr><th>Date</th><th>Donor</th><th class="num">Amount</th><th>Pillar</th>
      <th>Child</th><th>Method</th><th>Channel</th><th>Reference</th><th>Receipt</th></tr></thead>
    <tbody>${rows.map(d => {
      const donor = DB.donors.find(x => x.id === d.donorId) || {};
      const pay = DB.payments.find(p => p.id === d.paymentId) || {};
      const rc = DB.receipts.find(r => r.donationId === d.id);
      const ch = d.childId ? childById(d.childId) : null;
      return `<tr>
        <td style="white-space:nowrap">${fmtDate(d.dateISO)}</td>
        <td><b>${esc(donor.name)}</b><br><span class="muted" style="font-size:.75rem">${esc(donor.email)}</span></td>
        <td class="num"><b>${money(d.amountKobo)}</b></td>
        <td>${esc(pillarName(d.pillarId))}</td>
        <td>${ch ? esc(childName(ch)) : '—'}</td>
        <td>${esc(methodLabel(pay.method))}</td>
        <td><span class="badge ${pay.channel === 'offline' ? 'b-gold' : 'b-blue'}">${pay.channel === 'offline' ? 'Offline' : 'Online'}</span></td>
        <td style="font-size:.78rem">${esc(pay.reference)}</td>
        <td>${rc ? `<a href="#/receipt/${rc.id}">${esc(rc.no)}</a>` : '—'}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="9" class="tbl-empty">No donations match these filters.</td></tr>`}</tbody></table>
  </div>`;
}

function adminDonors() {
  const rows = DB.donors.map(d => {
    const st = donorStats(d.id);
    const last = st.donations.slice().sort((a, b) => b.dateISO.localeCompare(a.dateISO))[0];
    return { d, st, last };
  }).sort((a, b) => b.st.lifetime - a.st.lifetime);

  return `<p class="muted" style="font-size:.84rem">${DB.donors.length} donor records. A donor is created automatically the first time an email address gives — online or offline.</p>
  <div class="tbl-wrap" style="margin-top:12px">
    <table><thead><tr><th>Donor</th><th>Phone</th><th class="num">Lifetime</th><th class="num">This year</th>
      <th>Pillars</th><th class="num">Children</th><th>Last gift</th><th></th></tr></thead>
    <tbody>${rows.map(({ d, st, last }) => `<tr>
      <td><b>${esc(d.name)}</b><br><span class="muted" style="font-size:.75rem">${esc(d.email)}</span></td>
      <td style="font-size:.8rem">${esc(d.phone || '—')}</td>
      <td class="num"><b>${money(st.lifetime)}</b></td>

      <td style="white-space:nowrap">${last ? fmtDate(last.dateISO) : '—'}</td>
      <td class="num"><button class="btn btn-ghost btn-sm" data-viewdonor="${d.id}">Open</button></td>
    </tr>`).join('')}</tbody></table></div>`;
}

    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-top:16px">

    ${(() => {

      ${(() => {

function saveOffline() {
  const g = id => $('#' + id);
  const name = g('oName').value.trim();
  const email = g('oEmail').value.trim().toLowerCase();
  const amount = K(parseInt(String(g('oAmount').value).replace(/[^0-9]/g, ''), 10) || 0);
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);

  g('oNameErr').hidden = !!name;
  g('oEmailErr').hidden = emailOk;
  g('oAmountErr').hidden = amount > 0;
  if (!name || !emailOk || !amount) return;

  const pillarId = g('oPillar').value;
  const childId = pillarId === 'sponsorship' ? (g('oChild').value || null) : null;

  const { donor, created } = findOrCreateDonor({ name, email, phone: g('oPhone').value.trim() });
  const res = recordDonation({
    donorId: donor.id, amountKobo: amount, pillarId, childId,
    method: g('oMethod').value, channel: 'offline',

    title: 'Donation recorded',
    body: `<div class="center" style="padding:4px 0 16px">

/* ============================================================================
   ROUTER
   ========================================================================== */
function route() {
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, query] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  const a = parts[0] || '', b = parts[1] || '';
  let html;

  if (a === '' || a === 'home') html = viewHome();
  else if (a === 'sponsor') html = viewSponsor();
  else if (a === 'me') html = viewMe();
  else if (a === 'impact') html = viewImpact();
  else if (a === 'receipt') html = viewReceipt(b);
  else if (a === 'presentation') html = viewPresentation();
  else if (a === 'admin' && PUBLIC_BUILD) html = viewAdminUnavailable();
  else if (a === 'admin' && b === 'offline') html = viewOffline();
  else if (a === 'admin') html = viewAdmin();
  else if (a === 'give') { html = viewHome(); }
  else html = viewHome();

  app().innerHTML = html;
  window.scrollTo(0, 0);

  bandStop();
  if (a === 'sponsor') {
    renderKids();
    _bandIx = 0; bandStart();
    const band = $('#band');
    if (band) {                                   // swipe on touch devices
      let x0 = null;
      band.addEventListener('touchstart', ev => { x0 = ev.touches[0].clientX; }, { passive: true });
      band.addEventListener('touchend', ev => {
        if (x0 === null) return;
        const dx = ev.changedTouches[0].clientX - x0;
        if (Math.abs(dx) > 45) bandGo(_bandIx + (dx < 0 ? 1 : -1), true);
        x0 = null;
      }, { passive: true });
    }
    if (query === 'give') {
      const first = DB.children.find(c => childStatus(c) === 'waiting');
      if (first) setTimeout(() => showChild(first.id), 220);
    }
  }
  if (a === 'give') setTimeout(() => startGive(null), 60);

  /* animate the meters in from zero */
  requestAnimationFrame(() => {
    document.querySelectorAll('.meter-fill').forEach(el => {
      const w = el.style.width; el.style.width = '0%';
      requestAnimationFrame(() => { el.style.width = w; });
    });
  });
}

/* ============================================================================
   GLOBAL EVENTS — one delegated listener for the whole app
   ========================================================================== */
/* Some embedded/sandboxed viewers block or hijack in-frame navigation, which
   made the sponsorship filters look like they were redirecting. Drive internal
   links from script instead of relying on the browser following the href. */
document.addEventListener('click', e => {
  const link = e.target.closest('a[href^="#/"]');
  if (link && !e.metaKey && !e.ctrlKey && !e.shiftKey && link.target !== '_blank') {
    e.preventDefault();
    const to = link.getAttribute('href').slice(1);
    if (link.hasAttribute('data-close')) closeModal();
    if (('#' + location.hash.replace(/^#/, '')) === ('#' + to)) route();
    else location.hash = to;
    return;
  }
}, true);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-close],[data-give],[data-supports],[data-copybank],[data-page],[data-band],[data-banddot],[data-child],[data-filter],[data-class],[data-pick],[data-amt],[data-method],[data-next],[data-back],[data-pay],[data-atab],[data-signin],[data-signout],[data-saveoffline],[data-savesettings],[data-reset],[data-viewdonor],[data-nav],#burger');
  if (!t) return;

  if (t.id === 'burger') {
    const n = $('#mobnav'); n.classList.toggle('open');
    t.setAttribute('aria-expanded', n.classList.contains('open'));
    return;
  }
  if (t.hasAttribute('data-nav')) { location.hash = t.getAttribute('data-nav'); return; }
  if (t.hasAttribute('data-close')) {
    closeModal();
    if (t.tagName === 'A') { /* let the link proceed */ }
    return;
  }
  if (t.hasAttribute('data-supports')) { showSupports(t.getAttribute('data-supports')); return; }
  if (t.hasAttribute('data-copybank')) {
    const v = t.getAttribute('data-copybank');
    if (navigator.clipboard) navigator.clipboard.writeText(v).then(() => toast('Account number copied'), () => toast(v));
    else toast(v);
    return;
  }

  if (t.hasAttribute('data-give')) {
    const p = t.getAttribute('data-give') || null;
    const c = t.getAttribute('data-child') || null;
    const n = $('#mobnav'); if (n) n.classList.remove('open');
    startGive(p, c);
    return;
  }
  if (t.hasAttribute('data-child')) { showChild(t.getAttribute('data-child')); return; }
  if (t.hasAttribute('data-viewdonor')) { showDonor(t.getAttribute('data-viewdonor')); return; }

  /* sponsorship directory filters */
  if (t.hasAttribute('data-filter')) { _filter = t.getAttribute('data-filter'); _page = 1; route(); return; }
  if (t.hasAttribute('data-class')) { _class = t.getAttribute('data-class'); _page = 1; route(); return; }
  if (t.hasAttribute('data-band')) { bandGo(_bandIx + (+t.getAttribute('data-band')), true); return; }
  if (t.hasAttribute('data-banddot')) { bandGo(+t.getAttribute('data-banddot'), true); return; }
  if (t.hasAttribute('data-page')) {
    _page = parseInt(t.getAttribute('data-page'), 10) || 1;
    renderKids();
    const list = $('#kidlist');
    if (list) window.scrollTo({ top: list.offsetTop - 90, behavior: 'smooth' });
    return;
  }

  /* donation flow */
  if (t.hasAttribute('data-pick')) {
    GIVE.pillarId = t.getAttribute('data-pick'); GIVE.childId = null; GIVE.step = 1; renderGive(); return;
  }
  if (t.hasAttribute('data-amt')) {
    const v = parseInt(t.getAttribute('data-amt'), 10);
    document.querySelectorAll('[data-amt]').forEach(x => x.classList.remove('on'));
    if (v) { t.classList.add('on'); $('#gAmt').value = naira(v); $('#gAmtErr').hidden = true; }
    else { $('#gAmt').value = ''; $('#gAmt').focus(); }
    return;
  }
  if (t.hasAttribute('data-method')) {
    GIVE.method = t.getAttribute('data-method');
    document.querySelectorAll('[data-method]').forEach(x => x.classList.remove('on'));
    t.classList.add('on'); return;
  }
  if (t.hasAttribute('data-next')) {
    const n = +t.getAttribute('data-next');
    if (n === 2 && !readAmountStep()) return;
    if (n === 3 && !readDetailsStep()) return;
    GIVE.step = n; renderGive(); return;
  }
  if (t.hasAttribute('data-back')) { GIVE.step = +t.getAttribute('data-back'); renderGive(); return; }
  if (t.hasAttribute('data-pay')) { doPay(); return; }

  /* donor sign-in */
  if (t.hasAttribute('data-signin')) {
    const em = $('#siEmail').value.trim().toLowerCase();
    const d = DB.donors.find(x => x.email === em);
    if (!d) { $('#siErr').hidden = false; return; }
    DB.session.donorId = d.id; route(); toast('Signed in as ' + d.name); return;
  }
  if (t.hasAttribute('data-signout')) { DB.session.donorId = null; route(); toast('Signed out'); return; }

  /* admin */
  if (t.hasAttribute('data-atab')) {
    _adminTab = t.getAttribute('data-atab');
    document.querySelectorAll('[data-atab]').forEach(x => x.classList.toggle('on', x === t));
    $('#adminBody').innerHTML = adminTabBody();
    return;
  }
  if (t.hasAttribute('data-saveoffline')) { saveOffline(); return; }
  if (t.hasAttribute('data-savesettings')) { saveSettings(); return; }
  if (t.hasAttribute('data-reset')) {
    seed(); applySponsorshipRate(); DB.session.donorId = null; route();
    toast('Demo data reset');
    return;
  }
});

/* live donor-match hint on the offline form */
document.addEventListener('input', e => {
  if (e.target.id === 'oEmail') {
    const em = e.target.value.trim().toLowerCase();
    const d = DB.donors.find(x => x.email === em);
    const hint = $('#oMatch'); if (!hint) return;
    if (d) {
      const st = donorStats(d.id);
      hint.innerHTML = `<b style="color:var(--green)">Matched: ${esc(d.name)}</b> — ${st.donations.length} previous gift(s), ${money(st.lifetime)} lifetime. This donation joins that record.`;
      const nm = $('#oName'); if (nm && !nm.value) nm.value = d.name;
    } else {
      hint.textContent = em ? 'No record yet — a new donor will be created.' : 'Used to match or create the donor record.';
    }
  }
  if (['dq'].includes(e.target.id)) { _donFilter.q = e.target.value; $('#adminBody').innerHTML = adminTabBody(); $('#dq').focus(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'dp') { _donFilter.pillar = e.target.value; $('#adminBody').innerHTML = adminTabBody(); }
  if (e.target.id === 'dc') { _donFilter.channel = e.target.value; $('#adminBody').innerHTML = adminTabBody(); }
  if (e.target.id === 'oPillar') {
    const wrap = $('#oChild'); if (wrap) wrap.disabled = e.target.value !== 'sponsorship';
  }
});

function saveSettings() {
  document.querySelectorAll('[data-set]').forEach(el => {
    const k = el.getAttribute('data-set'), type = el.getAttribute('data-type');
    if (type === 'money') SETTINGS[k] = K(parseInt(String(el.value).replace(/[^0-9]/g, ''), 10) || 0);
    else if (type === 'number') SETTINGS[k] = parseInt(el.value, 10) || SETTINGS[k];
    else SETTINGS[k] = el.value;
  });
  document.querySelectorAll('[data-pset]').forEach(el => {
    const [pid, field] = el.getAttribute('data-pset').split(':');
    const p = pillarById(pid);
    if (p) p[field] = K(parseInt(String(el.value).replace(/[^0-9]/g, ''), 10) || 0);
  });
  applySponsorshipRate();
  route();
  toast('Settings saved');
}

/* ============================================================================
   BOOT
   ========================================================================== */
window.addEventListener('hashchange', route);
seed();
applySponsorshipRate();
route();

</script>
</body>
</html>
